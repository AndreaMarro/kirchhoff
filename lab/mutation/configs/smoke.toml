[cosmic-ray]
module-path = "lab/mutation_smoke/subject.py"
timeout = 20.0
excluded-modules = []
# The wrapper creates a fresh PYC prefix per mutation without requiring a shell.
test-command = "python lab/mutation/run_pytest_no_cache.py --module lab/mutation_smoke/subject.py --import-name lab.mutation_smoke.subject tests/test_cosmic_ray_smoke.py"

[cosmic-ray.distributor]
name = "local"
