[cosmic-ray]
module-path = "src/kirchhoff/domain/verify.py"
timeout = 45.0
excluded-modules = []
# The wrapper creates a fresh PYC prefix per mutation without requiring a shell.
test-command = "python lab/mutation/run_pytest_no_cache.py --module src/kirchhoff/domain/verify.py --import-name kirchhoff.domain.verify tests/test_verify.py tests/test_il_prodotto_funziona.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]
