[cosmic-ray]
module-path = "src/kirchhoff/domain/truthfulness.py"
timeout = 45.0
excluded-modules = []
# The wrapper creates a fresh PYC prefix per mutation without requiring a shell.
test-command = "python lab/mutation/run_pytest_no_cache.py --module src/kirchhoff/domain/truthfulness.py --import-name kirchhoff.domain.truthfulness tests/test_truthfulness_arch.py tests/test_truthfulness_claim.py tests/test_truthfulness_comparator.py tests/test_truthfulness_contracts.py tests/test_truthfulness_matrix.py tests/test_truthfulness_nodal.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.filters.operators-filter]
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]
