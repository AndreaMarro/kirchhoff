[cosmic-ray]
module-path = "src/kirchhoff/domain/didactic/observation.py"
timeout = 45.0
excluded-modules = []
# The wrapper creates a fresh PYC prefix per mutation without requiring a shell.
test-command = "python lab/mutation/run_pytest_no_cache.py --module src/kirchhoff/domain/didactic/observation.py --import-name kirchhoff.domain.didactic.observation tests/test_didactic_observation.py tests/test_didactic_execute_transform.py tests/test_hypothesis_didactic.py"

[cosmic-ray.distributor]
name = "local"

[cosmic-ray.filters.operators-filter]
# Nei quattro moduli target `|` compare solo nelle annotazioni PEP 604: mutarlo
# non esercita semantica runtime. Il filtro e' eseguito e riportato dallo script.
exclude-operators = ["core/ReplaceBinaryOperator_BitOr_.*"]
