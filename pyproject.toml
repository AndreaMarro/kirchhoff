[project]
name = "kirchhoff"
version = "0.1.0"
description = "Risolutore di circuiti verificato — motore e apparato di misura"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
kirchhoff-eval = "kirchhoff.eval.cli:main"
kirchhoff = "kirchhoff.pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kirchhoff"]

[tool.pytest.ini_options]
# --cov-report=json non e' un extra: scripts/check_domain_coverage.py legge
# coverage.json. Senza, il gate misura un artefatto vecchio e puo' dichiarare
# 100% su file che non ha mai visto (verificato il 24/08/2026: era fermo all'11 agosto).
addopts = "-q --cov=kirchhoff --cov-report=term-missing --cov-report=json --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.report]
# Righe non raggiungibili da un test, escluse deliberatamente e per nome.
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["src/kirchhoff"]
