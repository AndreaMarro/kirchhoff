[project]
name = "kirchhoff"
version = "0.1.0"
description = "Risolutore di circuiti verificato — motore e apparato di misura"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "hypothesis==6.167.0",
    "pytest>=8",
    "pytest-cov>=5",
]
research = [
    "lcapy==1.26",
    "mutmut==3.4.0",
    "networkx==3.6.1",
    "schemdraw==0.23",
]

[project.scripts]
kirchhoff-eval = "kirchhoff.eval.cli:main"
kirchhoff = "kirchhoff.pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kirchhoff"]

[tool.pytest.ini_options]
# --cov-report=json non e' un extra: scripts/check_domain_coverage.py legge
# coverage.json. Senza, il gate misura un artefatto vecchio e puo' dichiarare
# 100% su file che non ha mai visto (verificato il 24/08/2026: era fermo all'11 agosto).
addopts = "-q --cov=kirchhoff --cov-report=term-missing --cov-report=json --cov-fail-under=95"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.report]
# Righe non raggiungibili da un test, escluse deliberatamente e per nome.
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["src/kirchhoff"]

[tool.mutmut]
also_copy = ["src", "lab"]
paths_to_mutate = [
    "src/kirchhoff/domain/didactic/observation.py",
    "src/kirchhoff/domain/didactic/orchestrate.py",
    "src/kirchhoff/domain/truthfulness.py",
    "src/kirchhoff/domain/verify.py",
]
pytest_add_cli_args = ["-o", "addopts="]
pytest_add_cli_args_test_selection = [
    "tests/test_didactic_observation.py",
    "tests/test_didactic_execute_transform.py",
    "tests/test_didactic_orchestrate.py",
    "tests/test_hypothesis_didactic.py",
    "tests/test_hypothesis_stateful.py",
    "tests/test_truthfulness_arch.py",
    "tests/test_truthfulness_claim.py",
    "tests/test_truthfulness_comparator.py",
    "tests/test_truthfulness_contracts.py",
    "tests/test_truthfulness_matrix.py",
    "tests/test_truthfulness_nodal.py",
    "tests/test_verify.py",
]
