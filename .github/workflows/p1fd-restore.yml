name: p1fd-restore
on:
  push:
    branches: [work/student-vertical-slice-0.1-phase1]
    paths:
      - "ops/p1fd-restore/**"
      - ".github/workflows/p1fd-restore.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/student-vertical-slice-0.1-phase1
      - name: Reconstruct P1-FD from P1-F blob and patches
        run: |
          set -euo pipefail
          git show 35973989ca7eea6649f6ada71054d6dcb46cae52:src/kirchhoff/domain/didactic/analytical.py \
            > src/kirchhoff/domain/didactic/analytical.py
          patch -p1 < ops/p1fd-restore/analytical.patch
          for p in ops/p1fd-restore/test_*.patch; do
            patch -p1 < "$p"
          done
          test -f src/kirchhoff/domain/didactic/analytical.py
          grep -q "class SimpleSupernode" src/kirchhoff/domain/didactic/analytical.py
          grep -q "def applica_passo" src/kirchhoff/domain/didactic/analytical.py
          grep -q "operands: tuple\[str, \.\.\.\]" src/kirchhoff/domain/didactic/analytical.py
          ! grep -q "def _scrivi_kcl" src/kirchhoff/domain/didactic/analytical.py
          ! grep -q "def _scrivi_vincolo" src/kirchhoff/domain/didactic/analytical.py
          wc -l src/kirchhoff/domain/didactic/analytical.py
          rm -rf ops/p1fd-restore
          rm -f .github/workflows/p1fd-restore.yml
          git add -A
          git config user.name "elab"
          git config user.email "63306494+AndreaMarro@users.noreply.github.com"
          git commit -m "fix(didactic): complete operand-aware analytical dispatch"
          git push origin HEAD:work/student-vertical-slice-0.1-phase1
