name: test

on:
  push:
  pull_request:

# Test-only CI: nessun segreto, nessuna scrittura, nessun deploy.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ambiente bloccato da uv.lock (decisione O0): riproducibilita'
      # contro `pip install -e .[dev]` che risolve le versioni newest.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Toolchain pinnata e verificata (tag upstream 0.11.8): senza pin
          # setup-uv risolve "latest" via rete a ogni run (fragile e non
          # riproducibile; osservato fetch failed su manifest versioni).
          version: "0.11.8"
      - name: Sync frozen environment
        run: uv sync --frozen --extra dev --extra mcp
      - name: Build reference-set
        run: uv run --no-sync kirchhoff-eval build --n 60 --seed 1 --depth 3 --split 0.6 --out reference-set
      # Packaging tests exercise the real self-contained MCP App artifact.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked App build dependencies
        run: npm ci
        working-directory: web
      - name: Build standalone and MCP App resources
        run: npm run build
        working-directory: web
      # La baseline comprende il test PDF reale. Il CLI storico cerca solo il
      # layout cache macOS: la fixture esplicita lo riproduce su Linux, senza
      # attribuire al CLI un discovery multipiattaforma che non implementa.
      - name: Browser reale per il test PDF del CLI
        working-directory: web
        run: |
          npx playwright install --with-deps chromium-headless-shell
          python3 - <<'PY_BROWSER'
          from pathlib import Path
          cache = Path.home() / '.cache/ms-playwright'
          browsers = sorted(cache.glob('chromium_headless_shell-*/**/chrome-headless-shell'))
          assert browsers, 'Playwright non ha installato il browser richiesto dal test PDF'
          fixture = Path.home() / 'Library/Caches/ms-playwright/chromium_headless_shell-ci'
          fixture.mkdir(parents=True, exist_ok=False)
          (fixture / 'chrome-headless-shell').symlink_to(browsers[-1])
          PY_BROWSER
      - name: pytest
        run: uv run --no-sync python -m pytest
      - name: coverage (no regression + domain 100%)
        run: uv run --no-sync python scripts/check_domain_coverage.py
      - name: boundaries
        run: uv run --no-sync python scripts/check_boundaries.py
