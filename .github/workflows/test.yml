name: test

on:
  push:
  pull_request:

# Test-only CI: nessun segreto, nessuna scrittura, nessun deploy.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ambiente bloccato da uv.lock (decisione O0): riproducibilita'
      # contro `pip install -e .[dev]` che risolve le versioni newest.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync frozen environment
        run: uv sync --frozen --extra dev
      - name: Build reference-set
        run: uv run --no-sync kirchhoff-eval build --n 60 --seed 1 --depth 3 --split 0.6 --out reference-set
      - name: pytest
        run: uv run --no-sync python -m pytest
      - name: domain coverage
        run: uv run --no-sync python scripts/check_domain_coverage.py
      - name: boundaries
        run: uv run --no-sync python scripts/check_boundaries.py
