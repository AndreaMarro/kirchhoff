name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build reference-set
        run: kirchhoff-eval build --n 60 --seed 1 --depth 3 --split 0.6 --out reference-set
      - name: pytest
        run: pytest
      - name: domain coverage
        run: python scripts/check_domain_coverage.py
      - name: boundaries
        run: python scripts/check_boundaries.py
