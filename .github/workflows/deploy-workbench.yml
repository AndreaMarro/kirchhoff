name: deploy-workbench

# Beta pubblica statica: la build Vite di web/ su GitHub Pages.
# Nessun backend, nessun segreto, nessuna scrittura oltre Pages.
# Si attiva solo da main (merge di PR), mai dalle PR stesse.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-workbench.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installazione bloccata
        run: npm ci
        working-directory: web
      - name: Controllo tipi
        run: npm run typecheck
        working-directory: web
      - name: Unit test
        run: npm run test
        working-directory: web
      - name: Build di produzione
        run: npm run build
        working-directory: web
      - name: Pacchetto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblicazione su Pages
        id: deployment
        uses: actions/deploy-pages@v4
